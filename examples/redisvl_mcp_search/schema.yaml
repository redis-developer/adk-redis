# Redis index schema for the redisvl_mcp_search sample.
#
# Mirrors `examples/redis_search_tools/schema.yaml` so users can compare
# the in-process Python tool path with the MCP toolset path on the same
# knowledge base. The `rvl mcp` server reads the live index for its
# search-records description; the schema below shapes those hints.

version: "0.1.0"

index:
  name: adk_mcp_knowledge_base
  prefix: mcp_doc

fields:
  - name: title
    type: text

  - name: content
    type: text

  - name: url
    type: tag

  - name: category
    type: tag  # redis, adk, concepts, tutorials

  - name: doc_type
    type: tag  # reference, tutorial, faq, api

  - name: difficulty
    type: tag  # beginner, intermediate, advanced

  - name: embedding
    type: vector
    attrs:
      algorithm: hnsw
      dims: 768
      distance_metric: cosine
      datatype: float32

# Redis index schema for the SQL search sample (product catalog).
# RedisSQLSearchTool translates SQL SELECT statements into FT.SEARCH /
# FT.AGGREGATE commands via the optional sql-redis extra.

version: "0.1.0"

index:
  name: adk_sql_catalog
  prefix: catalog

fields:
  - name: title
    type: text

  - name: description
    type: text

  - name: category
    type: tag  # electronics, fitness, kitchen, office

  - name: brand
    type: tag

  - name: price
    type: numeric

  - name: rating
    type: numeric

  - name: stock
    type: numeric
